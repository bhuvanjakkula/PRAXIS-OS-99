services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: praxis
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U praxis -d praxis"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: [python, -m, praxis.product.manage, migrate]
    environment:
      PRAXIS_DATABASE_URL: ${PRAXIS_DATABASE_URL:?Set the PostgreSQL SQLAlchemy URL}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports: ["127.0.0.1:8766:8000"]
    environment:
      PRAXIS_DATABASE_URL: ${PRAXIS_DATABASE_URL:?Set database URL}
      PRAXIS_SIGNING_KEY: ${PRAXIS_SIGNING_KEY:?Set a random signing key of at least 32 bytes}
      PRAXIS_AI_PROVIDER: ${PRAXIS_AI_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PRAXIS_OPENAI_MODEL: ${PRAXIS_OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      PRAXIS_OPENAI_TIMEOUT: ${PRAXIS_OPENAI_TIMEOUT:-30}
      PRAXIS_OPENAI_MAX_OUTPUT_TOKENS: ${PRAXIS_OPENAI_MAX_OUTPUT_TOKENS:-2500}
      PRAXIS_AI_ALLOWED_CLASSIFICATIONS: ${PRAXIS_AI_ALLOWED_CLASSIFICATIONS:-public}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      PRAXIS_DATABASE_URL: ${PRAXIS_DATABASE_URL:?Set database URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  postgres-data:
