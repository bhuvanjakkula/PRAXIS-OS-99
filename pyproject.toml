[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-os"
version = "0.9.0"
readme = "README.md"
description = "Adaptive Decision Intelligence: evidence, systems, imagination, inquiry, simulation and human judgment."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8"]

[project.optional-dependencies]
pqc = ["pqcrypto==1.0.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]
production = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "PyJWT>=2.10,<3", "opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30"]

[project.scripts]
praxis-pqc = "praxis.security.pqc:main"
praxis-os = "praxis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["praxis*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
praxis = ["web/*.html", "web/*.css", "web/*.js", "web/*.json"]

[tool.vercel]
entrypoint = "main:app"
