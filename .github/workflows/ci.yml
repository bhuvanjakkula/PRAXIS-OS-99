name: PRAXIS verification
on: [push, pull_request, workflow_dispatch]
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev,production]' build
      - run: python -m pytest -q
      - run: for file in src/praxis/web/*.js; do node --check "$file"; done
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praxis_test
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: praxis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U praxis_test"
          --health-interval 5s --health-retries 20
    env:
      PRAXIS_TEST_POSTGRES_URL: postgresql+psycopg://praxis_test:ci-disposable-password@localhost:5432/praxis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,production]'
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: npm install --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t praxis-api:test .
      - run: docker build -f Dockerfile.worker -t praxis-worker:test .
