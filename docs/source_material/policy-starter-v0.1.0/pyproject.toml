[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-os-starter"
version = "0.1.0"
description = "Evidence-first public policy decision-support starter"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
entrypoint = "praxis_os.api.main:app"
